        nav a {

        nav a:hover {

    <nav>

    <section>
        <div class="menu-item">
            <img src="cakes.jpeg" alt="Cake">

        </div>
        <div class="menu-item">
            <img src="bread.jpeg" alt="Bread">

            <p>Starting Price: RS.50</p>

        <div class="menu-item">
